<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>
  <div id="progress" aria-hidden="true"><div id="bar"></div></div>
  <header class="topbar">
    <button id="backBtn" class="mini hidden" type="button">← Back</button>
    <button id="restartBtn" class="mini" type="button">↻ Restart</button>
  </header>

  <main>
    <!-- 1. Countdown + fireworks + welcome -->
    <section id="intro" class="screen active">
      <canvas id="fw" aria-hidden="true"></canvas>
      <div id="count" aria-live="polite"></div>
      <div id="welcome" class="card hidden">
        <h1 id="greet"></h1>
        <p id="welcomeMsg"></p>
        <button id="startBtn" class="btn hidden" type="button">Surprise 💌</button>
      </div>
    </section>

    <!-- 2. Question gate (filled by script.js) -->
    <section id="gate" class="screen"><div class="card" id="gateBox"></div></section>

    <!-- 3. Photo gallery -->
    <section id="gallery" class="screen">
      <h2 class="title"> MOMENTS 💗</h2>
      <div id="grid" class="grid"></div>
      <button class="btn" type="button" data-go="cake">Next</button>
    </section>

    <!-- 4. Cake -->
    <section id="cake" class="screen">
      <h2 class="title">Make a Wish 🎂</h2>
      <svg id="cakeSvg" viewBox="0 0 300 270" role="img" aria-label="Pink birthday cake">
        <defs>
          <clipPath id="cl"><rect width="150" height="270"/></clipPath>
          <clipPath id="cr"><rect x="150" width="150" height="270"/></clipPath>
          <g id="body">
            <ellipse cx="150" cy="250" rx="140" ry="12" fill="#f6c9da"/>
            <rect x="40" y="185" width="220" height="62" rx="14" fill="#ffb3cc"/>
            <rect x="65" y="128" width="170" height="60" rx="14" fill="#ff8fb5"/>
            <rect x="90" y="78" width="120" height="52" rx="12" fill="#ffd9e7"/>
            <g stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 17" fill="none">
              <path d="M50 190H250"/><path d="M75 132H225"/><path d="M100 82H200"/>
            </g>
            <g fill="#7fd1ff"><rect x="96" y="50" width="8" height="30" rx="2"/><rect x="126" y="50" width="8" height="30" rx="2"/><rect x="166" y="50" width="8" height="30" rx="2"/><rect x="196" y="50" width="8" height="30" rx="2"/></g>
            <rect x="60" y="215" width="9" height="3" fill="#7fd1ff" transform="rotate(30 64 216)"/>
            <rect x="210" y="218" width="9" height="3" fill="#ffe066" transform="rotate(-30 214 219)"/>
            <rect x="105" y="150" width="9" height="3" fill="#fff" transform="rotate(20 109 151)"/>
            <rect x="190" y="160" width="9" height="3" fill="#ffe066" transform="rotate(-20 194 161)"/>
            <text x="108" y="178" font-size="16">💗</text><text x="178" y="238" font-size="16">⭐</text><text x="60" y="238" font-size="14">🌸</text>
          </g>
        </defs>
        <g class="half hl"><use href="#body" clip-path="url(#cl)"/></g>
        <g class="half hr"><use href="#body" clip-path="url(#cr)"/></g>
        <g id="flames"><ellipse class="flame" cx="100" cy="42" rx="5" ry="9" fill="#ffc53d"/><ellipse class="flame" cx="130" cy="42" rx="5" ry="9" fill="#ffc53d"/><ellipse class="flame" cx="170" cy="42" rx="5" ry="9" fill="#ffc53d"/><ellipse class="flame" cx="200" cy="42" rx="5" ry="9" fill="#ffc53d"/></g>
        <g id="knife"><rect x="147" y="30" width="6" height="140" rx="2" fill="#dfe6ee" stroke="#9aa7b5"/><rect x="142" y="0" width="16" height="32" rx="5" fill="#e0457b"/></g>
      </svg>
      <button id="cutBtn" class="btn" type="button">Cut the Cake 🎂</button>
      <div id="ageMsg" class="card glow hidden" aria-live="polite"></div>
      <button id="cakeNext" class="btn hidden" type="button" data-go="quiz">Ready for some questions?💕</button>
    </section>

    <!-- 5. Quiz -->
    <section id="quiz" class="screen">
      <h2 class="title">HOW WELL DO YOU KNOW US? 💕</h2>
      <div class="card" id="quizBox"></div>
    </section>

    <!-- 6. Love letter -->
    <section id="letter" class="screen">
      <h2 class="title">One Last Surprise for You 💗</h2>
      <div id="envelope" class="envelope"><div class="flap"></div><div class="pocket"></div><span class="seal">💗</span></div>
      <button id="openBtn" class="btn" type="button">Open Your Letter</button>
      <article id="paper" class="paper hidden">
        <div id="paperText"></div>
        <p id="sig" class="sig"></p>
        <button id="closeLetter" class="btn small" type="button">Close Letter</button>
      </article>
    </section>
  </main>

  <div id="lightbox" class="hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button id="lbClose" type="button" aria-label="Close">✕</button>
    <div id="lbContent"></div><p id="lbCap"></p>
  </div>

  <button id="musicBtn" type="button" aria-label="Play or pause music" aria-pressed="false" title="Play / pause music">🎵<span class="eq"><i></i><i></i><i></i></span></button>
  <audio id="bgm" src="assets/background-music.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
